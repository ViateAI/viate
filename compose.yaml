services:
  server:
    image: ghcr.io/viateai/viate:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4317:4317"
    environment:
      HOST: "0.0.0.0"
      PORT: "4317"
      VIATE_DATA_DIR: "/data"
      VIATE_ADMIN_PASSWORD: "${VIATE_ADMIN_PASSWORD:-}"
    volumes:
      - viate-data:/data
    stop_grace_period: 10s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4317/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  viate-data:
