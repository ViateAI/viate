# The @viateai/sdk package must exist before this job can update it.
# One-time setup is a local `npm publish --access public` from packages/sdk
# while logged in, then on npmjs.com add a GitHub Actions trusted publisher
# for repository ViateAI/viate and workflow file npm-publish.yml.
# Later releases use OIDC from this workflow. No npm token.
name: Publish @viateai/sdk

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @viateai/sdk build
      - working-directory: packages/sdk
        run: npm publish --access public
